<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Document Search</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b90a0;
    --accent: #5b8cff;
    --accent-dim: #2c3a63;
    --good: #4caf82;
    --bad: #e2665a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.25rem; }
  header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.85rem; }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1.5rem;
    padding: 1.5rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
  }
  .panel h2 {
    margin: 0 0 0.75rem;
    font-size: 0.95rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0.75rem 0 0.25rem; }
  input[type="file"], select, input[type="number"], textarea {
    width: 100%;
    background: #0d0f14;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.5rem 0.6rem;
    font-size: 0.9rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }

  button {
    margin-top: 0.9rem;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.6rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { background: var(--accent-dim); cursor: default; }

  .status-line { margin-top: 0.6rem; font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }
  .status-line.ok { color: var(--good); }
  .status-line.err { color: var(--bad); }

  .chat-log { display: flex; flex-direction: column; gap: 1rem; }
  .empty-hint { color: var(--muted); font-size: 0.9rem; }

  .qa-block { border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
  .qa-block:last-child { border-bottom: none; }
  .question { font-weight: 600; margin-bottom: 0.4rem; }
  .mode-tag {
    display: inline-block;
    font-size: 0.7rem;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
    margin-left: 0.5rem;
    vertical-align: middle;
  }
  .answer { white-space: pre-wrap; line-height: 1.5; margin-bottom: 0.6rem; }

  .sources { display: flex; flex-direction: column; gap: 0.5rem; }
  .source {
    background: #0d0f14;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
    font-size: 0.8rem;
  }
  .source .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.3rem; }
  .source .text { color: var(--text); opacity: 0.85; }

  form { margin: 0; }
</style>
</head>
<body>
<header>
  <h1>RAG Document Search</h1>
  <p>Upload PDFs, then ask questions against vector-only or hybrid (dense + sparse + rerank) retrieval.</p>
</header>

<div class="layout">
  <div class="panel">
    <h2>Ingest a document</h2>
    <form id="ingest-form">
      <label for="pdf-file">PDF file</label>
      <input type="file" id="pdf-file" name="file" accept="application/pdf" required>
      <button type="submit" id="ingest-btn">Upload &amp; Ingest</button>
    </form>
    <div class="status-line" id="ingest-status"></div>

    <h2 style="margin-top:1.5rem">Retrieval settings</h2>
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="vector">Vector-only</option>
      <option value="hybrid">Hybrid (dense + sparse + rerank)</option>
    </select>
    <label for="top-k">Top K</label>
    <input type="number" id="top-k" value="5" min="1" max="20">
  </div>

  <div class="panel">
    <h2>Ask a question</h2>
    <form id="ask-form">
      <textarea id="question" placeholder="What would you like to know about the ingested documents?" required></textarea>
      <button type="submit" id="ask-btn">Ask</button>
    </form>
    <div class="status-line" id="ask-status"></div>

    <div class="chat-log" id="chat-log" style="margin-top:1.25rem">
      <p class="empty-hint">No questions asked yet.</p>
    </div>
  </div>
</div>

<script>
const ingestForm = document.getElementById("ingest-form");
const ingestStatus = document.getElementById("ingest-status");
const ingestBtn = document.getElementById("ingest-btn");

const askForm = document.getElementById("ask-form");
const askStatus = document.getElementById("ask-status");
const askBtn = document.getElementById("ask-btn");
const chatLog = document.getElementById("chat-log");
const questionInput = document.getElementById("question");

function setStatus(el, message, kind) {
  el.textContent = message;
  el.className = "status-line" + (kind ? " " + kind : "");
}

ingestForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById("pdf-file");
  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  ingestBtn.disabled = true;
  setStatus(ingestStatus, "Uploading and ingesting...");

  try {
    const res = await fetch("/api/ingest", { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Ingest failed");
    setStatus(ingestStatus, `Ingested ${data.source}: ${data.pages} pages, ${data.chunks} chunks.`, "ok");
    ingestForm.reset();
  } catch (err) {
    setStatus(ingestStatus, err.message, "err");
  } finally {
    ingestBtn.disabled = false;
  }
});

askForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = questionInput.value.trim();
  if (!question) return;

  const mode = document.getElementById("mode").value;
  const topK = parseInt(document.getElementById("top-k").value, 10) || 5;

  askBtn.disabled = true;
  setStatus(askStatus, "Thinking...");

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode, top_k: topK }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");

    renderAnswer(question, data);
    setStatus(askStatus, "", "");
    questionInput.value = "";
  } catch (err) {
    setStatus(askStatus, err.message, "err");
  } finally {
    askBtn.disabled = false;
  }
});

function renderAnswer(question, data) {
  const emptyHint = chatLog.querySelector(".empty-hint");
  if (emptyHint) emptyHint.remove();

  const block = document.createElement("div");
  block.className = "qa-block";

  const sourcesHtml = (data.sources || []).map((s) => {
    const scoreParts = [];
    if (s.score != null) scoreParts.push(`score ${s.score.toFixed(3)}`);
    if (s.fused_score != null) scoreParts.push(`fused ${s.fused_score.toFixed(4)}`);
    if (s.rerank_score != null) scoreParts.push(`rerank ${s.rerank_score.toFixed(3)}`);
    return `
      <div class="source">
        <div class="meta">
          <span>${escapeHtml(s.source)} · p.${s.page_number}</span>
          <span>${scoreParts.join(" · ")}</span>
        </div>
        <div class="text">${escapeHtml(truncate(s.text, 220))}</div>
      </div>`;
  }).join("");

  block.innerHTML = `
    <div class="question">${escapeHtml(question)}<span class="mode-tag">${data.retrieval_mode}</span></div>
    <div class="answer">${escapeHtml(data.answer)}</div>
    <div class="sources">${sourcesHtml}</div>
  `;

  chatLog.prepend(block);
}

function truncate(text, n) {
  return text.length > n ? text.slice(0, n) + "…" : text;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
